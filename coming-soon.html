<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Aurex Capital</title>
  <meta name="description" content="Aurex Capital is launching something new. Sign up to be the first to know about our upcoming precious metals investment platform features.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <main>
    <section class="coming-soon">
      <div class="coming-soon__deco" aria-hidden="true"></div>
      <div class="coming-soon__content">
        <div class="coming-soon__logo">
          <span class="coming-soon__logo-icon"><i data-lucide="gem"></i></span>
          Aurex Capital
        </div>
        <h1>Something Extraordinary is Coming</h1>
        <p>We're building the next generation of precious metals investing. Be the first to experience it.</p>

        <div class="countdown" aria-label="Countdown timer">
          <div class="countdown__item">
            <span class="countdown__value" id="countdown-days">00</span>
            <span class="countdown__label">Days</span>
          </div>
          <div class="countdown__item">
            <span class="countdown__value" id="countdown-hours">00</span>
            <span class="countdown__label">Hours</span>
          </div>
          <div class="countdown__item">
            <span class="countdown__value" id="countdown-minutes">00</span>
            <span class="countdown__label">Minutes</span>
          </div>
          <div class="countdown__item">
            <span class="countdown__value" id="countdown-seconds">00</span>
            <span class="countdown__label">Seconds</span>
          </div>
        </div>

        <form class="coming-soon__form" data-validate>
          <input type="email" name="email" placeholder="Enter your email for early access" required class="form__input" aria-label="Email address">
          <button type="submit" class="btn btn--gold">Notify Me</button>
        </form>
        <div class="form__success" style="margin-block-start:var(--space-2);color:var(--color-success);text-align:center;">You're on the list! We'll be in touch.</div>

        <div class="footer__socials" style="justify-content:center;margin-block-start:var(--space-4);">
          <a href="#" class="footer__social" aria-label="LinkedIn" title="LinkedIn"><i data-lucide="linkedin"></i></a>
          <a href="#" class="footer__social" aria-label="Twitter" title="Twitter / X"><i data-lucide="twitter"></i></a>
          <a href="#" class="footer__social" aria-label="Instagram" title="Instagram"><i data-lucide="instagram"></i></a>
          <a href="#" class="footer__social" aria-label="YouTube" title="YouTube"><i data-lucide="youtube"></i></a>
          <a href="#" class="footer__social" aria-label="Facebook" title="Facebook"><i data-lucide="facebook"></i></a>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
