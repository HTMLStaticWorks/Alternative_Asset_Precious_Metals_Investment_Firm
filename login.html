<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Aurex Capital</title>
  <meta name="description" content="Log in to your Aurex Capital client portal to manage your precious metals portfolio, track holdings, and place orders.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <main>
    <section class="auth">
      <div class="auth__deco" aria-hidden="true"></div>
      <div class="auth__toggles">
        <button class="navbar__toggle-btn" data-theme-toggle aria-label="Toggle theme" onclick="toggleTheme()"><i data-lucide="moon"></i></button>
        <button class="navbar__toggle-btn" aria-label="Toggle RTL" onclick="toggleRTL()"><i data-lucide="arrow-left-right"></i></button>
      </div>
      <div class="auth__card">
        <a href="index.html" class="auth__logo">
          <span class="auth__logo-icon"><i data-lucide="gem"></i></span>
          Aurex Capital
        </a>
        <h1 class="auth__title">Welcome Back</h1>
        <p class="auth__subtitle">Sign in to access your portfolio</p>

        <form class="form" data-validate id="login-form">
          <div class="form__group">
            <label class="form__label" for="login-email">Email</label>
            <input type="email" id="login-email" name="email" class="form__input" required placeholder="you@example.com" aria-required="true">
            <span class="form__error"></span>
          </div>
          <div class="form__group">
            <label class="form__label" for="login-password">Password</label>
            <input type="password" id="login-password" name="password" class="form__input" required data-min-length="8" placeholder="••••••••" aria-required="true">
            <span class="form__error"></span>
          </div>
          
          <div class="auth__actions">
            <div class="form__checkbox">
              <input type="checkbox" id="login-remember" name="remember">
              <label for="login-remember">Remember me</label>
            </div>
            <a href="#" class="auth__forgot" id="login-forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--gold" style="width:100%;" id="login-submit">Login</button>
          <div class="form__success">Login successful! Redirecting...</div>
        </form>

        <div class="auth__divider">or continue with</div>

        <div class="auth__social-btns">
          <button class="auth__social-btn" type="button" id="login-google">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A10.998 10.998 0 0 0 12 23Z" fill="#34A853"/><path d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.72.13-1.43.34-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.46 1.18 4.93l3.66-2.84Z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53Z" fill="#EA4335"/></svg>
            Continue with Google
          </button>
          <button class="auth__social-btn" type="button" id="login-apple">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09ZM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25Z"/></svg>
            Continue with Apple
          </button>
        </div>

        <div class="auth__footer">
          Don't have an account? <a href="register.html">Register</a>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
